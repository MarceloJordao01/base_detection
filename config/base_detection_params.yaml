base_detection:
  ros__parameters:

    # Tópicos
    color_image_topic: "/drone1_espcam/image_raw/compressed"
    inferred_image_topic: "/base_detection/inferred_image"
    detected_coords_topic: "/base_detection/detected_coords"
    num_bases_topic: "/base_detection/num_bases"

    # ---------- Fusão ----------
    # Habilita/desabilita a fusão de detecções por proximidade de centróides.
    fusion.enable: true
    # Distância máxima entre centróides para entrarem no mesmo cluster (em pixels).
    fusion.max_dist_px: 40
    # Distância máxima como fração da diagonal da imagem (ex.: 0.05 = 5%).
    fusion.max_dist_frac: 0.05

    # ---------- Bias por detector ----------
    # Pesos multiplicativos aplicados à "confiança" de cada candidato
    # APENAS para seleção do representante do cluster.
    # Colocar 0.0 desabilita efetivamente a participação do detector na fusão.
    bias.square: 1.0   # quadrados azuis
    bias.circle: 1.0   # círculos amarelos
    bias.yolo: 0.0     # YOLO (direto)

    # Thresholds de score
    square_score_threshold: 0.8
    circle_score_threshold: 0.6
    yolo_conf_threshold: 0.25

    # Compat (mantido)
    yolo.model_path: "/tello_ros_ws/install/base_detection/share/base_detection/models/best.pt"
    detection_threshold: 0.50

    # HSV AZUL
    blue_hsv_lower: [100.0, 40.0, 80.0]
    blue_hsv_upper: [135.0, 255.0, 255.0]

    # HSV AMARELO (faixa ampliada)
    yellow_hsv_lower: [15.0, 40.0, 120.0]
    yellow_hsv_upper: [35.0, 255.0, 255.0]

    # Pré-processamento / morfologia (apenas para HSV; YOLO ignora)
    kernel_blur_size: 5
    clahe_clip_limit: 2.0
    clahe_tile_grid: 8
    morph_open_k: 3
    morph_close_k: 5

    # Quadrados (azul)
    min_square_area: 500.0
    approx_epsilon_frac: 0.04

    # Círculos (contornos)
    min_circle_radius: 5
    max_circle_radius: 300
    min_circle_area: 50.0
    min_circle_circularity: 0.8

    # YOLO (terceiro detector, sem pré-processamento)
    enable_yolo: true
    yolo.conf_threshold: 0.25
    yolo.iou_threshold: 0.45
    yolo.imgsz: 640
    yolo.max_det: 300
    yolo.classes: []      # pode ficar vazio, o node faz fallback seguro
    yolo.device: "auto"
    yolo.half: false
